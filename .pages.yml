media:
  input: assets/img
  # Sem barra inicial: o site vive numa subpasta (…/Art_Stamp_Creations/) e todos
  # os dados usam caminhos relativos. "/assets/…" apontaria para a raiz do domínio.
  output: assets/img

content:
  # ---------------- GERAL / HERO / CONTACTOS / B2B / RODAPÉ ----------------
  - name: site
    label: Geral (hero, contactos, empresas, rodapé)
    type: file
    path: data/site.json
    fields:
      - name: hero
        label: Destaque (topo da página)
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta pequena, type: string }
          - { name: title, label: "Título (antes da palavra destacada)", type: string }
          - { name: highlight, label: "Palavra destacada (a laranja)", type: string }
          - { name: title_end, label: "Fim do título (ex.: ponto final)", type: string }
          - { name: lead, label: Texto principal, type: text }
          - { name: image, label: Imagem do destaque, type: image }
          - { name: badge, label: Selo sobre a imagem, type: string }
          - { name: cta_primary, label: "Botão principal (texto)", type: string }
          - { name: cta_secondary, label: "Botão secundário (texto)", type: string }
          - { name: audience, label: "Público-alvo (chips)", type: string, list: true }
      - name: contacts
        label: Contactos (aparecem em todo o site)
        type: object
        fields:
          - { name: phone, label: "Telefone (visível)", type: string }
          - { name: phone_intl, label: "Telefone internacional (ex.: 351932938467)", type: string }
          - { name: email, label: Email, type: string }
          - { name: instagram_url, label: Link do Instagram, type: string }
          - { name: instagram_handle, label: "Nome do Instagram (ex.: @artstamp...)", type: string }
          - { name: address_line1, label: "Morada (linha 1)", type: string }
          - { name: address_line2, label: "Morada (linha 2)", type: string }
      - name: contacto
        label: Secção Contacto (títulos + formulário)
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
          - { name: lead, label: Subtítulo, type: text }
          - { name: form_options, label: "Opções do formulário (O que precisas?)", type: string, list: true }
      - name: b2b
        label: Faixa Empresas / B2B
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
          - { name: lead, label: Texto, type: text }
          - { name: list, label: Lista (itens), type: string, list: true }
          - { name: cta_label, label: "Botão (texto)", type: string }
          - { name: image, label: Imagem, type: image }
      - { name: footer_tagline, label: Frase do rodapé, type: text }
      - { name: owner_name, label: Nome do titular (páginas legais), type: string }

  # ---------------- SERVIÇOS ----------------
  - name: services
    label: Serviços (O que fazemos)
    type: file
    path: data/services.json
    fields:
      - name: head
        label: Títulos da secção
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
          - { name: lead, label: Subtítulo, type: text }
      - name: services
        label: Lista de serviços
        type: object
        list: true
        fields:
          - name: icon
            label: Ícone
            type: select
            options:
              values: [tshirt, hoodie, polo, cap, mug, sticker, dtf, uv, vinyl, banner]
          - { name: title, label: Título, type: string }
          - { name: desc, label: Descrição, type: text }

  # ---------------- TRABALHOS / GALERIA ----------------
  - name: gallery
    label: Trabalhos (galeria)
    type: file
    path: data/gallery.json
    fields:
      - name: head
        label: Títulos da secção
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
          - { name: lead, label: Subtítulo, type: text }
      - name: items
        label: Trabalhos
        type: object
        list: true
        fields:
          - { name: img, label: Imagem, type: image }
          - { name: cap, label: Legenda, type: string }

  # ---------------- CATÁLOGO TÊXTIL ----------------
  - name: models
    label: Catálogo Têxtil
    type: file
    path: data/models.json
    fields:
      - name: head
        label: Títulos da secção
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
          - { name: lead, label: Subtítulo / introdução, type: text }
      - name: models
        label: Modelos
        type: object
        list: true
        fields:
          - { name: name, label: Nome, type: string }
          - name: cat
            label: Categoria
            type: select
            options:
              values: ["T-shirts", "Polos", "Sweats e hoodies", "Casacos e softshell", "Vestuário de trabalho", "Sacos e acessórios"]
          - { name: img, label: Imagem, type: image }
          - { name: tag, label: "Descrição curta", type: string }
          - { name: gsm, label: "Gramagem (ex.: 190 g/m²)", type: string }
          - { name: fabric, label: Tecido, type: string }
          - { name: gender, label: Género, type: string }
          - { name: sizes_label, label: "Etiqueta do 3.º campo (por defeito 'Tamanhos'; ex.: 'Capacidade')", type: string }
          - { name: sizes, label: "Tamanhos / valor do 3.º campo (ex.: XS–5XL ou 8 L)", type: string }
          - { name: colors, label: "Nº de cores", type: number }

  # ---------------- CATÁLOGO RÍGIDOS ----------------
  - name: rigidos
    label: Catálogo Rígidos
    type: file
    path: data/rigidos.json
    fields:
      - name: head
        label: Títulos da secção
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
          - { name: lead, label: Subtítulo / introdução, type: text }
      - { name: cats, label: "Categorias / filtros (começa por 'Todos')", type: string, list: true }
      - name: products
        label: Artigos
        type: object
        list: true
        fields:
          - { name: name, label: Nome, type: string }
          - { name: cat, label: "Categoria (igual a uma das de cima)", type: string }
          - { name: imgs, label: "Imagens (a 1ª é a principal)", type: image, list: true }
          - name: specs
            label: Características
            type: object
            list: true
            fields:
              - { name: label, label: "Nome (ex.: Material)", type: string }
              - { name: value, label: "Valor (ex.: Cerâmica)", type: string }

  # ---------------- COMO FUNCIONA ----------------
  - name: steps
    label: Como funciona (passos)
    type: file
    path: data/steps.json
    fields:
      - name: head
        label: Títulos da secção
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
      - name: steps
        label: Passos
        type: object
        list: true
        fields:
          - { name: title, label: Título do passo, type: string }
          - { name: desc, label: Descrição, type: text }

  # ---------------- PERGUNTAS FREQUENTES ----------------
  - name: faq
    label: Perguntas frequentes
    type: file
    path: data/faq.json
    fields:
      - name: head
        label: Títulos da secção
        type: object
        fields:
          - { name: eyebrow, label: Etiqueta, type: string }
          - { name: title, label: Título, type: string }
      - name: items
        label: Perguntas e respostas
        type: object
        list: true
        fields:
          - { name: q, label: Pergunta, type: string }
          - { name: a, label: Resposta, type: text }
