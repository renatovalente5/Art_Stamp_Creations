<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Stamp Creations — Personalização e Estampagem</title>
  <meta name="description" content="Damos vida às tuas ideias. Personalização de t-shirts, sweats, canecas, autocolantes, DTF, vinil e muito mais. Você imagina, nós criamos." />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fredoka-var.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/mulish-var.woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>
  <main id="conteudo">

    <!-- PROVA DE DESIGN (temporária — substituída no Bloco 3) -->
    <section class="section">
      <div class="container">
        <span class="eyebrow">Prova de design · Bloco 1</span>
        <h1 class="section-title">Damos vida às tuas <span class="text-accent">ideias</span>.</h1>
        <p class="section-lead">Você imagina, nós criamos. Personalizamos as suas ideias em produtos exclusivos — com atenção ao detalhe, qualidade e dedicação.</p>

        <div style="display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem">
          <a class="btn btn--primary btn--lg" href="#">Pedir orçamento</a>
          <a class="btn btn--accent btn--lg" href="#">Ver trabalhos</a>
          <a class="btn btn--dark" href="#">Escuro</a>
          <a class="btn btn--outline" href="#">Contorno</a>
          <a class="btn btn--wa" href="#">WhatsApp</a>
        </div>

        <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.6rem">
          <button class="chip" aria-pressed="true">Todos</button>
          <button class="chip" aria-pressed="false">T-shirts</button>
          <button class="chip" aria-pressed="false">Sweats</button>
          <button class="chip" aria-pressed="false">Canecas</button>
        </div>

        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:2rem">
          <span style="width:110px;height:76px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:end;padding:8px;font:600 .8rem var(--font-head)">#1A8CE4</span>
          <span style="width:110px;height:76px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:end;padding:8px;font:600 .8rem var(--font-head)">#26261A</span>
          <span style="width:110px;height:76px;border-radius:14px;background:var(--orange);color:var(--ink);display:flex;align-items:end;padding:8px;font:600 .8rem var(--font-head)">#FA9431</span>
          <span style="width:110px;height:76px;border-radius:14px;background:var(--red);color:#fff;display:flex;align-items:end;padding:8px;font:600 .8rem var(--font-head)">#E4231A</span>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
