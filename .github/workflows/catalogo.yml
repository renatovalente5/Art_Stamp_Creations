name: Catálogo em PDF

# Faz o catálogo com o que está no site — os dados de data/*.json e as
# fotografias (.github/catalogo/gerar.py) — e ENTREGA-O ao painel
# (backoffice.artstampcreations.pt), que guarda só o último e o serve no
# Início («Descarregar») e em https://catalogo.artstampcreations.pt (o link da
# bio do Instagram). Nada fica no repositório: o Renato não quer as versões
# guardadas (19 nov 2026).
#
# Só corre quando alguém pede: o «Atualizar catálogo» do painel, que é um
# workflow_dispatch no main, sem inputs — ou o botão «Run workflow» aqui no
# GitHub. Precisa do segredo CATALOGO_SEGREDO do repositório, o mesmo que o
# Worker do painel tem (scripts/segredo.sh no painel).

on:
  workflow_dispatch:

# Dois pedidos seguidos: o segundo espera pelo primeiro em vez de o cancelar
# (quem carregou quer o catálogo com o que acabou de gravar).
concurrency:
  group: catalogo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Pillow e o segno
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow segno

      - name: Instalar o Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Fazer o catálogo
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 .github/catalogo/gerar.py --saida "$RUNNER_TEMP/catalogo.pdf"

      - name: Entregar o catálogo ao painel
        env:
          CATALOGO_SEGREDO: ${{ secrets.CATALOGO_SEGREDO }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOGO_SEGREDO:-}" ]; then
            echo "::error::Falta o segredo CATALOGO_SEGREDO no repositório (o mesmo do Worker do painel)."
            exit 1
          fi
          # O segredo vai num ficheiro de cabeçalhos, escrito pelo printf da
          # própria shell: nunca num argumento de um processo (o ps vê-os).
          umask 077
          CAB="$RUNNER_TEMP/cabecalhos"
          printf 'authorization: Bearer %s\n' "$CATALOGO_SEGREDO" > "$CAB"
          printf 'x-catalogo: %s\n' "$(base64 -w0 "$RUNNER_TEMP/catalogo.json")" >> "$CAB"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 120 \
            -X POST "https://backoffice.artstampcreations.pt/catalogo/receber" \
            -H @"$CAB" -H "content-type: application/pdf" \
            --data-binary @"$RUNNER_TEMP/catalogo.pdf"
          echo
          rm -f "$CAB"
